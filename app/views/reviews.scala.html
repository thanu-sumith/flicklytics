@(id: String, category: String, name: String)

@main("FlickLytics - Review Sentiment") {
<div style="max-width: 800px; margin: 50px auto; padding: 20px;">
    <center>
        <h1>Review Sentiment Analysis <span id="connection-status" style="font-size: 14px; background: #ddd; padding: 2px 6px; border-radius: 4px;">Connecting...</span></h1>
        <h2>@name</h2>
        <h2 id="global-sentiment-header">Global Sentiment: <em style="color: #888;">Analyzing...</em></h2>
    </center>

    <div id="reviews-container">
        <div style="text-align: center; padding: 40px;">
            <em style="color: #6B7280;">Opening secure WebSocket and analyzing sentiment for up to 50 reviews...</em>
        </div>
    </div>
</div>

<script>
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
    const socket = new WebSocket(wsUrl);

    const statusBadge = document.getElementById("connection-status");
    const globalSentimentHeader = document.getElementById("global-sentiment-header");
    const reviewsContainer = document.getElementById("reviews-container");

    // 1. Ask the ManagerActor for the Reviews
    socket.onopen = function(event) {
        statusBadge.textContent = "Live";
        statusBadge.style.background = "#4CAF50";
        statusBadge.style.color = "white";
        setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ action: "ping" }));
            }
        }, 30000);
        const message = {
            action: "reviews",
            id: "@id",
            category: "@category",
            name: "@name"
        };
        socket.send(JSON.stringify(message));
    };

    // 2. Listen for the reviews coming back
    socket.onmessage = function(event) {
        const response = JSON.parse(event.data);

        if (response.messageType === "reviewResults") {
            const payload = response.data;
            const reviewsList = payload.reviews;

            // Instantly update the Global Sentiment header
            globalSentimentHeader.innerHTML = `Global Sentiment: <strong>${payload.globalSentiment}</strong>`;

            reviewsContainer.innerHTML = ""; // Clear loading text

            if (reviewsList.length === 0) {
                reviewsContainer.innerHTML = "<p style='text-align:center;'>No reviews found.</p>";
                return;
            }

            let htmlBlock = "";

            // Loop through Honey's array of reviews using her EXACT original HTML/CSS structure
            reviewsList.forEach(r => {
                htmlBlock += `
        <div style="background-color: #f4f4f4; border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:8px">
            <b>${r.author}</b>
            <span style="float:right; font-weight: bold;">${r.sentiment}</span>
            <p style="margin-top: 10px;">${r.content}</p>
        </div>
        `;
            });

            reviewsContainer.innerHTML = htmlBlock;
        }
    };

    socket.onclose = function(event) {
        statusBadge.textContent = "Disconnected";
        statusBadge.style.background = "#f44336";
    };
</script>
}
