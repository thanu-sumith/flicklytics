@(movieId: Integer)

@main("FlickLytics - Global Diversity") {
    <div style="max-width: 800px; margin: 50px auto; padding: 20px;">
        <center>
            <h1>Global Diversity Analytics <span id="connection-status" class="badge badge-na" style="font-size: 14px; vertical-align: middle; margin-left: 10px;">Connecting...</span></h1>
        </center>

        <div id="diversity-container">
            <div style="text-align: center; padding: 50px; background-color: #f4f4f4; border-radius: 8px;">
                <em style="color: #6B7280;">Opening secure WebSocket and analyzing global translations...</em>
            </div>
        </div>

    </div>

    <script>
        const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
        const socket = new WebSocket(wsUrl);
        
        const statusBadge = document.getElementById("connection-status");
        const diversityContainer = document.getElementById("diversity-container");

        // 1. Ask the ManagerActor for the Diversity Stats
        socket.onopen = function(event) {
            statusBadge.textContent = "Live Stream Active";
            statusBadge.className = "badge badge-blockbuster";
            setInterval(() => {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ action: "ping" }));
                }
            }, 30000);

            const message = {
                action: "diversity",
                movieId: @movieId
            };
            socket.send(JSON.stringify(message));
        };

        // 2. Listen for the data coming back
        socket.onmessage = function(event) {
            const response = JSON.parse(event.data);

            if (response.messageType === "diversityResults") {
                const diversity = response.data;
                diversityContainer.innerHTML = ""; // Clear loading text

                // Determine Summary Text based on Aman's original logic
                let summaryText = "";
                if (diversity.translationDensity >= 0.75 && diversity.localizationIndex >= 1.0) {
                    summaryText = "Excellent global reach with high-quality translations 🌍";
                } else if (diversity.translationDensity < 0.4) {
                    summaryText = "Limited international presence 📉";
                } else {
                    summaryText = "Moderate global reach with varying translation quality 📊";
                }

                // Determine Density Subtext
                let densitySubtext = "";
                if (diversity.translationDensity >= 0.75) densitySubtext = "<strong>-> High global coverage</strong>";
                else if (diversity.translationDensity >= 0.2) densitySubtext = "<strong>-> Moderate international reach</strong>";
                else densitySubtext = "<strong>-> Limited or regional reach</strong>";

                // Determine Localization Subtext
                let locSubtext = "";
                if (diversity.localizationIndex >= 1.0) locSubtext = "<strong>-> Very high-quality translations available</strong>";
                else if (diversity.localizationIndex >= 0.7) locSubtext = "<strong>-> Good quality translations</strong>";
                else if (diversity.localizationIndex >= 0.4) locSubtext = "<strong>-> Basic translations</strong>";
                else locSubtext = "<strong>-> Poor or incomplete translations</strong>";

                // Cap the Localization Index for the progress bar width (max 100%)
                const cappedLI = Math.min(diversity.localizationIndex, 1.0);

                // Build the UI
                const htmlBlock = `
                    <div style="margin-bottom: 20px; padding: 15px; background-color: #eef2f7; border-radius: 8px;">
                        <strong>Summary:</strong> ${summaryText}
                    </div>

                    <div style="background-color: #f4f4f4; padding: 20px; border-radius: 8px;">
                        
                        <p>
                            <strong>Translation Count:</strong> ${diversity.translationCount}<br>
                            <small>This is the number of languages the movie is translated in.</small>
                        </p>

                        <p><strong>Translation Density:</strong> ${diversity.translationDensity.toFixed(2)}</p>
                        <div style="background:#ddd; width:100%; height:10px; border-radius:5px; margin-bottom:10px; overflow:hidden;">
                            <div style="width:${diversity.translationDensity * 100}%; background:#4CAF50; height:10px; border-radius:5px; transition: width 1s ease-in-out;"></div>
                        </div>
                        <small>Indicates global reach. ${densitySubtext}</small>

                        <br><br>

                        <p><strong>Localization Index:</strong> ${diversity.localizationIndex.toFixed(2)}</p>
                        <div style="background:#ddd; width:100%; height:10px; border-radius:5px; margin-bottom:10px; overflow:hidden;">
                            <div style="width:${cappedLI * 100}%; background:#2196F3; height:10px; border-radius:5px; transition: width 1s ease-in-out;"></div>
                        </div>
                        <small>Measures translation quality. ${locSubtext}</small>

                    </div>
                `;

                diversityContainer.innerHTML = htmlBlock;
            }
        };

        socket.onclose = function(event) {
            statusBadge.textContent = "Disconnected";
            statusBadge.className = "badge badge-loss";
        };
    </script>
}
